name: Motion Impact CI

on:
  push:
    branches:
      - "feat/slu-impact-motion-adapter"
  pull_request:

jobs:
  verify-motion-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run check
      - name: Test
        run: npm test
