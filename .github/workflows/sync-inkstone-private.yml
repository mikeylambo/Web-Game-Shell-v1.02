name: sync-inkstone-private

on:
  push:
    branches: ["integration/inkstone-v0.5"]
    paths: [".github/workflows/sync-inkstone-private.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/inkstone-v0.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import current Inkstone V0.5 branch
        run: |
          rm -rf /tmp/inkstone consumers/inkstone
          git clone --depth 1 --branch v0.5/flagship-foundation https://github.com/mikeylambo/Inkstone.git /tmp/inkstone
          mkdir -p consumers/inkstone
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude 'vendor/slu-web-shell-v1.0.2' \
            /tmp/inkstone/ consumers/inkstone/

      - name: Link Inkstone to the local private Shell
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'consumers/inkstone/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.name = 'inkstone';
          pkg.private = true;
          pkg.dependencies ??= {};
          pkg.dependencies['@slu/web-shell'] = 'file:../..';
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          fs.rmSync('consumers/inkstone/package-lock.json', { force: true });
          NODE

      - name: Build and verify private Shell
        run: |
          npm install
          npm run verify:base

      - name: Build imported Inkstone against local Shell
        working-directory: consumers/inkstone
        run: |
          npm install
          npm run build

      - name: Commit verified private workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add consumers/inkstone
          if git diff --cached --quiet; then
            echo "Private Inkstone workspace already current."
            exit 0
          fi
          git commit -m "sync: import verified Inkstone v0.5 workspace"
          git push origin HEAD:integration/inkstone-v0.5
