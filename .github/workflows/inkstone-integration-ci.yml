name: inkstone-integration-ci

on:
  push:
    branches: ["integration/inkstone-v0.5"]
    paths:
      - "consumers/inkstone/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/inkstone-integration-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify private Shell
        run: |
          npm install
          npm run verify:base

      - name: Install Inkstone workspace
        working-directory: consumers/inkstone
        run: npm install

      - name: Prove V0.4 feel-source parity
        working-directory: consumers/inkstone
        run: npm run parity

      - name: Prove Shell lifecycle contract
        working-directory: consumers/inkstone
        run: npm run test:lifecycle

      - name: Prove Shell persistence contract
        working-directory: consumers/inkstone
        run: npm run test:persistence

      - name: Prove Shell navigation contract
        working-directory: consumers/inkstone
        run: npm run test:navigation

      - name: Prove release platform contract
        working-directory: consumers/inkstone
        run: npm run test:platform

      - name: Prove release certification contract
        working-directory: consumers/inkstone
        run: npm run test:certification

      - name: Build Inkstone against live private Shell
        working-directory: consumers/inkstone
        run: npm run build

      - name: Certify production bundle
        working-directory: consumers/inkstone
        run: npm run certify:build

      - name: Package V0.5 major-playtest build
        uses: actions/upload-artifact@v4
        with:
          name: inkstone-v0.5-major-playtest-${{ github.sha }}
          path: consumers/inkstone/dist
          if-no-files-found: error
          retention-days: 14
