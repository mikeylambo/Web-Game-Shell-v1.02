name: refresh-dist

on:
  push:
    branches: ["build/refresh-dist-v1.0.2"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/refresh-dist-v1.0.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Pack compiled Shell
        run: |
          rm -rf packages
          mkdir -p packages
          npm pack --pack-destination packages
      - name: Bundle minimal Inkstone browser surface
        run: |
          npx --yes esbuild@0.25.9 tools/inkstone-shell-entry.ts \
            --bundle \
            --format=esm \
            --platform=browser \
            --target=es2022 \
            --minify \
            --legal-comments=none \
            --outfile=packages/inkstone-shell-v1.0.2.mjs
      - name: Commit generated dist and package snapshots
        run: |
          if [ -z "$(git status --porcelain -- dist packages)" ]; then
            echo "dist and package snapshots already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist packages
          git commit -m "build: refresh generated dist package"
          git push origin HEAD:build/refresh-dist-v1.0.2
