name: refresh-dist

on:
  push:
    branches: ["build/refresh-dist-v1.0.2"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/refresh-dist-v1.0.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Pack compiled Shell
        run: |
          rm -rf packages
          mkdir -p packages
          npm pack --pack-destination packages
      - name: Commit generated dist and package snapshot
        run: |
          if git diff --quiet -- dist packages; then
            echo "dist and package snapshot already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist packages
          git commit -m "build: refresh generated dist package"
          git push origin HEAD:build/refresh-dist-v1.0.2
